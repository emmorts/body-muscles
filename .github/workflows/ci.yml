name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build and verify the artifacts
        run: npm run build && npm run verify-build

      - name: Consumer type tests
        run: npm run test:types

      # The declarations are emitted by the current compiler but must still parse in the
      # documented consumer minimum.
      - name: Consumer type tests on TypeScript 5.0
        run: npm run test:types:min

      - name: Selection behaviour tests
        run: npm run test:selection

      - name: Packaged entry points
        run: npm run test:package

      - name: Install the browser for the behaviour tests
        run: npx playwright install --with-deps chromium

      - name: Browser behaviour tests
        run: npm run test:browser

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and build the library
        run: npm ci

      - name: Build the library
        run: npm run build

      - name: Build the vanilla TypeScript example
        run: npm ci --prefix examples/vanilla-typescript && npm run build --prefix examples/vanilla-typescript

      - name: Build the React example
        run: npm ci --prefix examples/react && npm run build --prefix examples/react
