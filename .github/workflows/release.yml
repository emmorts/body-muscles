# Publishing `@emmorts/body-muscles`.
#
# Release procedure (no changelog tooling, the version and CHANGELOG are hand-written):
#   1. Edit `package.json` (version) and `CHANGELOG.md`.
#   2. Commit and push to `main`; CI must be green.
#   3. Tag the release and push the tag: `git tag v1.1.0 && git push origin v1.1.0`.
#
# The tag must equal `v<package version>`, or this workflow fails before publishing.
# npm authenticates with the OIDC trusted publisher configured for this repository and
# workflow file, so there is no npm token in this repository. Provenance is generated
# automatically.
name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Confirm the tag matches the package version
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $declared"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build and verify the artifacts
        run: npm run build && npm run verify-build

      - name: Publish
        run: npm publish --access public
