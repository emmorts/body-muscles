# Publishing `@emmorts/body-muscles`.
#
# Cut a release with `npm run release -- <version>` (scripts/release.mjs): it checks the tree,
# the changelog and the tag, then bumps, commits, tags and pushes. To do it by hand:
#   1. Add a `## <version>` section to `CHANGELOG.md`.
#   2. Bump `version` in `package.json` and push to `main`; CI must be green.
#   3. `git tag v<version> && git push origin v<version>`.
#
# The tag must equal `v<package version>`, or this workflow fails before publishing.
# npm authenticates with the OIDC trusted publisher configured for this repository and workflow
# file, so there is no npm token in this repository; provenance is generated automatically.
# The GitHub release notes are the `## <version>` section of the changelog, so users read the
# same text here and on npm.
name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Confirm the tag matches the package version
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $declared"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build and verify the artifacts
        run: npm run build && npm run verify-build

      - name: Publish
        run: npm publish --access public

      # Notes come from the changelog section that ships inside the tarball, so the GitHub
      # release and the package tell users the same story.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" CHANGELOG.md > release-notes.md
          gh release create "v$version" --title "v$version" --notes-file release-notes.md --verify-tag
